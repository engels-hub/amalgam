[test-groups]
# GPU tests share one device; run them one at a time.
gpu = { max-threads = 1 }

[profile.default]

[[profile.default.overrides]]
filter = 'test(/gpu/)'
test-group = 'gpu'

# Timing tests (S00 performance targets, e.g. amg-jobs `timing_*`) measure latency on an
# otherwise idle machine, so they run alone: no other test runs while one is in progress.
[[profile.default.overrides]]
filter = 'test(/^timing_/)'
threads-required = 'num-test-threads'

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(/gpu/)'
test-group = 'gpu'

# Shared CI runners are noisy neighbours: retry timing tests (CI only; locally a failure shows).
[[profile.ci.overrides]]
filter = 'test(/^timing_/)'
threads-required = 'num-test-threads'
retries = 2

[profile.ci.junit]
path = "junit.xml"
