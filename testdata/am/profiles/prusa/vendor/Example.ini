# Hand-written vendor bundle in the PrusaSlicer INI layout.
[vendor]
name = Example

[printer:*common*]
printer_technology = FFF
bed_shape = 0x0,200x0,200x200,0x200
max_print_height = 200
nozzle_diameter = 0.4
min_layer_height = 0.07
max_layer_height = 0

[printer:*mmu*]
single_extruder_multi_material = 1
nozzle_diameter = 0.4,0.4,0.4,0.4,0.4

[printer:Example MK 0.4 nozzle]
inherits = *common*
printer_model = EXMK
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210

[printer:Example MK MMU]
inherits = Example MK 0.4 nozzle; *mmu*

[printer:Example Resin]
printer_technology = SLA
