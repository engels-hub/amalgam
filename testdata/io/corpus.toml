# Import/export corpus manifest (IO-01, S12). Format 1. One [[entry]] per file.
#
# Schema (note docs/notes/import-export-formats.md §11, same style as testdata/mesh/corpus.toml):
# - `id`       unique.
# - `file`     path relative to testdata/io/.
# - `kind`     "file" (default): the whole file; the harness runs `probe` and `Format::sniff`.
#              "head": only the first bytes of a larger file; `file_len` is the length of the
#              original file. The harness runs `Format::sniff(head, file_len)`.
# - `format`   expected format ("stl" | "3mf" | "obj" | "ply" | "step" | "iges" | "dxf" | "svg").
#              Absent when the content must not be recognised.
# - `expect`   "ok" or the name of the `IoError` variant `probe` must return (for example
#              "UnknownFormat").
# - `license`  SPDX id. `source_url` is the page the licence applies to ("synthetic: ..." for
#              files generated for the tests).
# - `sha256`   of the file as stored.
# - `fetch`    true: the file is NOT in the repo (a fetch script downloads it, pinned by
#              `fetch_url` + `fetch_sha256`). The harness skips it when absent.
# - Optional: `triangles`, `objects`, `unit`, `warnings` (reader WPs assert these), `note`.
#
# Files committed here use the `.fixture` extension so that the git-LFS and line-ending rules
# of the repository root leave them alone (see testdata/io/.gitattributes).
#
# The `heads/*.fixture` entries are synthetic (CC0-1.0): IO-01 sniff table. They are generated
# by hand-written bytes, not taken from any third-party file.

[corpus]
format = 1

