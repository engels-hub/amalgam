# Broken-mesh corpus manifest (MESH-28, S07). Format 1. One [[mesh]] entry per file.
#
# - `file`: path relative to testdata/mesh/. `real/...` files are committed through git-LFS;
#   `fetch/...` files (fetch = true) are NOT in the repo: `fetch.sh` / `fetch.ps1` download them
#   from `fetch_url` (pinned by `fetch_sha256`) and verify `sha256` of the resulting file.
# - `license`: SPDX id (or a LicenseRef-* for terms with no SPDX id). `source_url` is the page
#   the licence applies to; `author` / `title` carry the attribution that CC-BY needs.
# - `defects`: ground truth from the corpus builder (exact-weld edge statistics with numpy plus the
#   Thingi10K self-intersection counts), vocabulary in `amg_mesh::corpus::Defect`. It is
#   provisional until MESH-02 reproduces it (that WP must report these flags on 100 % of entries).
# - `expect_repairable = false`: scan-like soups excluded from the 95 % watertight target (wrap only).
# - `faces` is the triangle count stored in the file (STL: triangles, PLY: faces).
#
# Licence versions: Thingi10K records only the licence family. Thingiverse offered CC 3.0
# (unported) in 2009-2015, so CC-BY-3.0 / CC-BY-SA-3.0 are assumed. See real/thingi10k/README.md.

[corpus]
format = 1

