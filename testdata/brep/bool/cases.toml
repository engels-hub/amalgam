# BREP-04 boolean corpus (S02 Done-when 1). One [[case]] per boolean: operands are built from
# primitives on frames (kind box: corner at origin, dims [dx, dy, dz]; cylinder [r, h] and cone
# [r1, r2, h] from the base centre along `normal`; sphere [r] and torus [R, r] about the origin;
# rect: a planar face with a corner at origin, [w, h] along xdir and normal x xdir).
# `rotate = [ax, ay, az, angle]` turns every operand about that axis through the world origin.
# `volume` is the reference (analytic unless `source` says otherwise), compared within 1e-6
# relative (absolute 1e-9 mm^3 for 0); `error` names the expected KernelError variant; `solids`
# the expected solid count. `determinism = true` marks the 20 cases of the parallel-mode
# determinism test. `source` records where the case comes from.

