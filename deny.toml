# cargo-deny config (ADR-012). CI runs `cargo deny check` with default features (must be
# copyleft-free) and with `--all-features`. C++ deps from vcpkg are invisible here and are
# tracked by hand in THIRD_PARTY.md.
#
# Never enable glam's `fast-math` feature: it breaks bit-for-bit determinism.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
ignore = [
    # paste is unmaintained (no fix exists). It reaches us only through kcl-ezpz -> faer -> gemm,
    # behind amg-sketch's non-default `ezpz-bench` feature (SK-13 comparison only).
    { id = "RUSTSEC-2024-0436", reason = "proc-macro via the dev-only ezpz-bench feature" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The allow-list is policy, not a record of what is in use today.
unused-allowed-license = "allow"
# GPL/AGPL/LGPL crates are only allowed through per-crate exceptions that are listed in
# THIRD_PARTY.md and sit behind a cargo feature.
exceptions = [
    # S03 SK-13: SolveSpace libslvs, dev/test oracle behind amg-sketch feature `slvs` only.
    { allow = ["GPL-3.0"], crate = "slvs" },
]

[licenses.private]
# Our own crates are `publish = false` and carry LicenseRef-Amalgam-Personal.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
