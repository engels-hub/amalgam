# CI for Amalgam (S00 §7, FND-05).
#
# Third-party actions are pinned by commit SHA; the comment names the release. Bump them
# together with the comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bench:
        description: Also run the criterion benches and upload the report
        type: boolean
        default: false
      bench-filter:
        description: Criterion name filter for the bench run (regex, e.g. ^budget/); empty runs all
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; pushes to main always run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # vcpkg registry tag. Its commit must equal `builtin-baseline` in vcpkg.json (the vcpkg
  # action checks this). Bump both in one PR (docs/dev-setup.md §9).
  VCPKG_TAG: "2026.10.16"

defaults:
  run:
    shell: pwsh

jobs:
  fmt:
    name: fmt
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/vcpkg
        with:
          vcpkg-tag: ${{ env.VCPKG_TAG }}
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Feature-gated code (tracy, copyleft-gated backends, …) is linted too.
      # amg-sketch's `slvs` feature (SK-13 oracle) needs libclang <= 15, which the runner lacks,
      # so amg-sketch is linted with every other feature.
      - name: clippy (all features)
        run: cargo clippy --workspace --exclude amg-sketch --all-targets --all-features -- -D warnings
      - name: clippy (amg-sketch, all features but slvs)
        run: cargo clippy -p amg-sketch --all-targets --features ezpz-bench -- -D warnings

  test:
    name: test
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # GitHub runners have no GPU: run GPU tests on the WARP software adapter, and fail
      # (not skip) when no adapter is found.
      AMG_WGPU_BACKEND: warp
      AMG_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9
      - uses: ./.github/actions/vcpkg
        with:
          vcpkg-tag: ${{ env.VCPKG_TAG }}
      # Build once and archive the test binaries; `golden` runs from the archive instead of
      # rebuilding the workspace.
      - name: Build and archive test binaries
        run: cargo nextest archive --workspace --profile ci --archive-file "${{ runner.temp }}\nextest-archive.tar.zst"
      # After rust-cache (it restores the whole target dir) and after the build.
      - uses: ./.github/actions/install-warp
        with:
          target-dir: target/debug
      # Golden tests run in their own job, with LFS data.
      - run: cargo nextest run --workspace --profile ci -E 'not test(golden_)'
      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-test
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
      - name: Upload nextest archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}\nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1

  deny:
    name: deny
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20
      # Default features must be copyleft-free (ADR-012 permissive build).
      - name: cargo deny check (default features)
        run: cargo deny check
      - name: cargo deny check (all features)
        run: cargo deny --all-features check

  golden:
    name: golden
    needs: test
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      AMG_WGPU_BACKEND: warp
      AMG_REQUIRE_GPU: "1"
      # LFS objects are fetched here, so an un-fetched pointer is a failure, not a skip.
      AMG_REQUIRE_TESTDATA: "1"
    steps:
      # Checkout without LFS, then restore .git/lfs from the cache before pulling, so warm
      # runs don't spend the GitHub LFS bandwidth quota.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: List LFS objects
        run: git lfs ls-files --long | ForEach-Object { ($_ -split ' ')[0] } | Sort-Object | Out-File -Encoding utf8 .lfs-assets-id
      - name: Restore LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Fetch LFS objects
        run: git lfs pull
      # No build here: the test binaries come from the `test` job's nextest archive. C++ deps
      # are linked statically (x64-windows-amg), so vcpkg isn't needed at run time. The
      # toolchain is still installed because nextest asks rustc for the sysroot.
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9
      - name: Download nextest archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      # Creates <extract>/target/debug{,/deps}. `--extract-overwrite` below writes the archive's
      # files into that tree and leaves the DLL in place (checked locally with nextest 0.9.148).
      - uses: ./.github/actions/install-warp
        with:
          target-dir: ${{ runner.temp }}\nextest\target\debug
      # --no-tests=pass: there are no golden tests until FND-06 and the first geometry WPs.
      - name: Run golden tests from the archive
        run: >-
          cargo nextest run --profile ci
          --archive-file "${{ runner.temp }}\nextest-archive.tar.zst"
          --workspace-remap .
          --extract-to "${{ runner.temp }}\nextest" --extract-overwrite
          -E 'test(golden_)' --no-tests=pass
      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-golden
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  # Benches are noisy on shared runners, so they only run on a manual dispatch with
  # `bench: true`. Vision budgets are the `budget/<id>` benches (amg_testkit::budget,
  # FND-08); `bench-filter: ^budget/` runs only those. amg-testkit enables criterion's
  # `html_reports` feature, so the artifact's report/index.html is the HTML report.
  bench:
    name: bench
    if: github.event_name == 'workflow_dispatch' && inputs.bench
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench
      - uses: ./.github/actions/vcpkg
        with:
          vcpkg-tag: ${{ env.VCPKG_TAG }}
      - name: cargo bench
        env:
          BENCH_FILTER: ${{ inputs.bench-filter }}
        run: |
          if ($env:BENCH_FILTER) { cargo bench --workspace -- $env:BENCH_FILTER }
          else { cargo bench --workspace }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload criterion report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion
          path: target/criterion
          if-no-files-found: error
