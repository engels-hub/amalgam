# Nightly fuzzing of the amg-io readers and the 3MF round trip (S12 IO-16, note
# import-export-formats.md §9.3).
#
# libFuzzer runs most reliably on Linux, so this is the one Linux job; the committed artifacts
# are replayed on Windows stable by `crates/amg-io/tests/fuzz_replay.rs` in ci.yml's test job.
# Each target runs 5 minutes with -rss_limit_mb=2048 -timeout=2 (fuzz/run.sh). The working
# corpus is cached between nights. On a finding the job fails and uploads the raw and the
# minimised input; commit the minimised one to testdata/io/fuzz/<target>/ with the fix.
#
# Third-party actions are pinned by commit SHA, the same pins as ci.yml.
name: Fuzz

on:
  schedule:
    # 02:17 UTC every night.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        type: number
        default: 300

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned nightly; bump together with the cargo-fuzz version below when it stops building.
  FUZZ_TOOLCHAIN: nightly-2026-11-21
  FUZZ_SECONDS: ${{ inputs.seconds || 300 }}

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - stl
          - obj
          - mtl
          - ply
          - threemf_package
          - threemf_model
          - paint_decode
          - roundtrip_scene
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      # The Orca slicer fixtures (about 120 kB, git-LFS) seed threemf_package.
      - name: Fetch the 3MF seed fixtures
        if: matrix.target == 'threemf_package'
        run: git lfs pull --include "testdata/io/slicer/*"
      - name: Install the pinned nightly
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --no-self-update
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target
          shared-key: fuzz
          cache-all-crates: true
      - name: Restore the working corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build
        env:
          FUZZ_BUILD_ONLY: "1"
        run: bash fuzz/run.sh "${{ matrix.target }}"
      - name: Fuzz
        run: bash fuzz/run.sh "${{ matrix.target }}" "$FUZZ_SECONDS"
      - name: Minimise findings
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p fuzz/minimised
          for f in fuzz/artifacts/"$TARGET"/*; do
            [ -f "$f" ] || continue
            cargo "+$FUZZ_TOOLCHAIN" fuzz tmin --fuzz-dir fuzz --debug-assertions \
              --target-dir fuzz/target "$TARGET" "$f" -- -runs=20000 -timeout=2 \
              -rss_limit_mb=2048 -exact_artifact_path="fuzz/minimised/$(basename "$f")" || true
          done
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/minimised
          if-no-files-found: warn
          retention-days: 30
