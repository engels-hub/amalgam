[package]
name = "amg-testkit"
description = "Dev-only test helpers: golden-geometry metrics, test data access and budget benches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Dev-only: other crates list this under [dev-dependencies]. It must never depend on a domain
# crate (they dev-depend on it); geometry comes in as a borrowed `TriSoup`.
[dependencies]
amg-core.workspace = true
pollster = { workspace = true, optional = true }
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
wgpu = { workspace = true, optional = true }

[features]
default = ["gpu"]
# `gpu_available()` probes a wgpu adapter. Without it, GPU tests always skip.
gpu = ["dep:wgpu", "dep:pollster"]

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true

[[bench]]
name = "hausdorff"
harness = false

[[bench]]
name = "budgets"
harness = false

[lints]
workspace = true
