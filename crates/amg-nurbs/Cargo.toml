[package]
name = "amg-nurbs"
description = "Pure-Rust NURBS curves and surfaces: evaluation, knot ops, fitting, skinning, Gordon surfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amg-core.workspace = true
serde.workspace = true
thiserror.workspace = true
# Inline derivative vectors (`NurbsCurve::derivs`); same pin as amg-sketch / amg-brep.
smallvec = { version = "1.16.3", features = ["serde"] }

[dev-dependencies]
approx.workspace = true
criterion.workspace = true
proptest.workspace = true
serde_json.workspace = true
# Differential test oracle only (S20 KH-07); never a normal dependency (MIT).
curvo = "=0.3.3"

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "knot_ops"
harness = false

[lints]
workspace = true
