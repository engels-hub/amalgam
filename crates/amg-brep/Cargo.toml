[package]
name = "amg-brep"
description = "B-rep kernel: BrepKernel trait, OCCT backend, shape handles, tessellation, topology and history."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amg-core.workspace = true
amg-jobs.workspace = true
amg-occt-sys.workspace = true
amg-nurbs.workspace = true
blake3.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
static_assertions = "1.1.0"
smallvec = { version = "1.16.3", features = ["serde"] }

[dev-dependencies]
amg-testkit.workspace = true
criterion.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# Link the vcpkg-built OCCT through amg-occt-sys. Off by default so the workspace builds without
# vcpkg (BREP-01, recorded in S02's Refinement log).
occt = ["amg-occt-sys/occt"]
# Adds the C++ fixture builders behind the `gen_brep_fixtures` example, which regenerates
# testdata/brep/. Not needed to run the tests: the fixtures are checked in.
fixture-gen = ["occt", "amg-occt-sys/fixture-gen"]

[[example]]
name = "gen_brep_fixtures"
path = "tests/gen/generate.rs"
required-features = ["fixture-gen"]

# S20 KH-01: replay, list, recover and promote kernel failure dumps (until `amg-cli kernel`).
[[example]]
name = "kernel-replay"
path = "examples/kernel-replay.rs"

# S20 KH-01: OnFailure capture overhead. Runs without OCCT too (the make_box pair needs it).
[[bench]]
name = "capture"
harness = false

[[bench]]
name = "brep_io"
harness = false
required-features = ["occt"]

[[bench]]
name = "kernel"
harness = false
required-features = ["occt"]

[[bench]]
name = "builders"
harness = false
required-features = ["occt"]

[[bench]]
name = "blend"
harness = false
required-features = ["occt"]

[[bench]]
name = "offset"
harness = false
required-features = ["occt"]

[[bench]]
name = "ops"
harness = false
required-features = ["occt"]

[[bench]]
name = "tess"
harness = false
required-features = ["occt"]

[[bench]]
name = "boolean"
harness = false
required-features = ["occt"]

[[bench]]
name = "query"
harness = false
required-features = ["occt"]

[[bench]]
name = "history"
harness = false
required-features = ["occt"]

[lints]
workspace = true
