# ---------------------------------------------------------------------------------------------
# FFF (material extrusion). Bambu TDS: properties table on page 2, printing settings on page 1;
# specimens printed at 100 % infill and annealed and dried before testing (page 3).
# ---------------------------------------------------------------------------------------------

[[material]]
id = "pla.fff"
revision = 1
name = "PLA (FFF printed)"
category = "polymer"
family = "pla"
condition = "printed, 100 % infill, annealed and dried 8 h at 55 degC before testing (Bambu Lab PLA Basic)"
default_source = "bambu-pla-basic-tds-v2"
appearance = "amg.builtin/plastic.white-matte"
tags = ["fff", "pla"]
density = { v = "1.24 g/cm^3", std = "ISO 1183", note = "TDS p.2" }

[material.mechanical]
elongation_at_break.xy = { v = "12.2 %", spec = "XYZ", std = "ISO 527", note = "TDS p.2, 12.2 +/- 0.4 %" }
elongation_at_break.z = { v = "7.5 %", spec = "ZXY", std = "ISO 527", note = "TDS p.2, 7.5 +/- 0.3 %" }

[material.mechanical.elastic]
model = "isotropic"
youngs = { v = "2680 MPa", spec = "XYZ", std = "ISO 527", note = "TDS p.2, X-Y, 2680 +/- 130 MPa; Z: 2160 +/- 90 MPa" }
poisson = { v = "0.35", src = "gawel-2023-pla", q = "typical", note = "Table 1, 100 % infill FDM PLA (0.38 at 75 %, 0.41 at 50 %)" }

[material.mechanical.strength]
ultimate_tensile.xy = { v = "39 MPa", spec = "XYZ", std = "ISO 527", note = "TDS p.2, 39 +/- 2 MPa" }
ultimate_tensile.z = { v = "35 MPa", spec = "ZXY", std = "ISO 527", note = "TDS p.2, 35 +/- 3 MPa" }
flexural = { v = "76 MPa", std = "ISO 178", note = "TDS p.2, X-Y, 76 +/- 3 MPa" }

[material.thermal]
glass_transition = { v = "60 degC", std = "DSC, 10 degC/min", note = "TDS p.2" }
melting = { v = "160 degC", std = "DSC, 10 degC/min", note = "TDS p.2" }
heat_deflection_045 = { v = "57 degC", std = "ISO 75", note = "TDS p.2" }

[material.am]
process = "material_extrusion"
slicer_type = "PLA"
nozzle_temp = { min = "190 degC", max = "230 degC" }
bed_temp = { min = "35 degC", max = "45 degC" }
chamber_temp = { min = "25 degC", max = "45 degC" }

