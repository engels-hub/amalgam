# Amalgam built-in material library v1 (MAT-05).
#
# Every value is taken from one individually cited document ([[source]] below; page or table
# in the `note` or in the comments). Nothing is copied from MatWeb, CAMPUS, Granta, Total
# Materia, the Fusion library or slicer profile packs (docs/notes/materials-data.md §3.1).
#
# Quality flags (note §3.2):
# - plain string = `measured` from the material's `default_source` (verbatim, unit-converted only);
# - `typical`    = a value from a cited paper or a "typical values" table of another document;
# - `estimate`   = engineering judgement, shown with a warning in the UI. Used only for Poisson's
#                  ratio where none of the fetched documents gives one (source `amg-estimate`).
#
# These are typical datasheet values, not design allowables. FFF entries are isotropic (XY
# values) with Z strengths where the TDS has Z specimens; MAT-04 upgrades them to
# transversely isotropic.

format = "amalgam-materials"
format_version = 1

[library]
id = "amg.builtin"
name = "Amalgam built-in"
version = "2026.1"
data_licence = "same as the code, citations kept (S17 open question 4)"
description = "Built-in library v1: 17 materials with per-value citations (MAT-05)."

