[package]
name = "amg-features"
description = "Timeline features implementing Feature. Split by module; each domain lane owns its module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amg-core.workspace = true
amg-jobs.workspace = true
amg-doc.workspace = true
amg-nurbs.workspace = true
amg-brep.workspace = true
amg-sketch.workspace = true
amg-mesh.workspace = true
amg-implicit.workspace = true
amg-subd.workspace = true
amg-materials.workspace = true
amg-io.workspace = true
amg-fem.workspace = true
amg-topopt.workspace = true
amg-am.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
# IO-14: blake3 of imported source bytes (`ImportSource::from_bytes`; already a workspace dependency).
blake3.workspace = true
# MESH-10: parallel chunked decimation of the SDF shell (already a workspace dependency).
rayon.workspace = true
# INS-02 section caps: 2D CDT with split constraints (same pin as amg-mesh; ADR-012, THIRD_PARTY.md).
spade = "=2.15.1"

[dev-dependencies]
proptest.workspace = true
# MESH-10 shell tests and bench: corpus loader, benchmark meshes, goldens.
amg-mesh = { workspace = true, features = ["corpus"] }
amg-testkit.workspace = true
criterion.workspace = true
rayon.workspace = true

[[bench]]
name = "mesh_shell"
harness = false

[[bench]]
name = "mesh_wrap"
harness = false

[[bench]]
name = "inspect_measure"
harness = false

[[bench]]
name = "inspect_section"
harness = false

[[bench]]
name = "inspect_props"
harness = false

# IO-09: solid bodies to 3MF through the OCCT tessellation.
[[bench]]
name = "io_tessellate"
harness = false
required-features = ["occt"]

[features]
# Links the OCCT backend of amg-brep, for tests on real B-rep solids (S06 ASM-09). Needs
# AMG_OCCT_DIR like amg-brep's own `occt` feature.
occt = ["amg-brep/occt"]
# MESH-27: links the Manifold boolean backend of amg-mesh (needs the vcpkg-built library, see
# amg-manifold-sys). Without it `mesh.combine` fails with "boolean backend unavailable".
manifold = ["amg-mesh/manifold"]

[lints]
workspace = true
