[package]
name = "amg-occt-sys"
description = "cxx bridge to OpenCASCADE (OCCT 8.0) over a coarse C++ shim (S02 BREP-01, ADR-002)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "amg-occt"
build = "build.rs"

[dependencies]
cxx = { version = "1.0.205", optional = true }
tracing = { workspace = true, optional = true }

[build-dependencies]
cxx-build = { version = "1.0.205", optional = true }

[features]
# Compile the C++ shim and link the vcpkg-built OCCT static libraries. Off by default, so a
# plain `cargo build --workspace` works without vcpkg (same pattern as `amg-mesh/manifold`).
# `amg-brep/occt` turns it on.
occt = ["dep:cxx", "dep:cxx-build", "dep:tracing"]
# Adds the C++ builders of the testdata/brep fixture parts (amg-brep's `gen_brep_fixtures`).
fixture-gen = ["occt"]

[lints]
workspace = true
