[package]
name = "amg-mesh"
description = "Triangle meshes: half-edge/indexed storage, repair, remesh, decimate, booleans and analysis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amg-core.workspace = true
amg-jobs.workspace = true
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true
# MESH-19 exact orientation predicates (ADR-012, THIRD_PARTY.md).
robust = "=1.2.0"
# MESH-20 hole filling: 2D CDT for planar loops, sparse Cholesky for fairing (ADR-012, THIRD_PARTY.md).
spade = "=2.15.1"
faer = { version = "=0.23.2", default-features = false, features = ["std", "sparse-linalg"] }
# MESH-28 corpus (feature `corpus`): manifest, hashing, seeded generators.
toml = { workspace = true, optional = true }
sha2 = { version = "0.10.9", optional = true }
rand_chacha = { version = "0.9.0", optional = true }
# MESH-05 booleans (feature `manifold`): Manifold + oneTBB via vcpkg (ADR-003, THIRD_PARTY.md).
amg-manifold-sys = { workspace = true, optional = true, features = ["native"] }

[features]
# `amg_mesh::corpus`: broken-mesh corpus manifest + loader, seeded defect and benchmark
# generators (MESH-28). Test support only; enabled for this crate's own tests via the
# self dev-dependency below and by other crates' `[dev-dependencies]`.
corpus = ["dep:toml", "dep:sha2", "dep:rand_chacha"]
# `boolean` / `boolean_n` through Manifold (MESH-05). Off by default: it links the vcpkg-built
# Manifold and oneTBB static libraries (`vcpkg install` at the repo root, see
# amg-manifold-sys/build.rs). Without it the boolean functions return `BackendUnavailable`.
manifold = ["dep:amg-manifold-sys"]

[dev-dependencies]
amg-mesh = { path = ".", features = ["corpus"] }
amg-testkit.workspace = true
serde_json.workspace = true
criterion.workspace = true
proptest.workspace = true
# Dev/bench-only reference implementations (S07 MESH-03, THIRD_PARTY.md).
obvhs = { version = "=0.4.0", features = ["parallel"] }
parry3d-f64 = "=0.31.1"

[[bench]]
name = "mesh_build"
harness = false

[[bench]]
name = "smooth"
harness = false

[[bench]]
name = "iso"
harness = false

[[bench]]
name = "mesh_spatial"
harness = false

[[bench]]
name = "mesh_decimate"
harness = false

[[bench]]
name = "mesh_selfint"
harness = false

[[bench]]
name = "mesh_analysis"
harness = false

[[bench]]
name = "mesh_remesh"
harness = false

[[bench]]
name = "mesh_holefill"
harness = false

[[bench]]
name = "mesh_repair"
harness = false

[[bench]]
name = "mesh_cut"
harness = false

[[bench]]
name = "mesh_segment"
harness = false

[[bench]]
name = "mesh_boolean"
harness = false
required-features = ["manifold"]

[[test]]
name = "boolean"
required-features = ["manifold"]

[lints]
workspace = true
