[package]
name = "amg-mesh"
description = "Triangle meshes: half-edge/indexed storage, repair, remesh, decimate, booleans and analysis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amg-core.workspace = true
amg-jobs.workspace = true
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true
# MESH-19 exact orientation predicates (ADR-012, THIRD_PARTY.md).
robust = "=1.2.0"
# MESH-28 corpus (feature `corpus`): manifest, hashing, seeded generators.
toml = { workspace = true, optional = true }
sha2 = { version = "0.10.9", optional = true }
rand_chacha = { version = "0.9.0", optional = true }

[features]
# `amg_mesh::corpus`: broken-mesh corpus manifest + loader, seeded defect and benchmark
# generators (MESH-28). Test support only; enabled for this crate's own tests via the
# self dev-dependency below and by other crates' `[dev-dependencies]`.
corpus = ["dep:toml", "dep:sha2", "dep:rand_chacha"]

[dev-dependencies]
amg-mesh = { path = ".", features = ["corpus"] }
amg-testkit.workspace = true
serde_json.workspace = true
criterion.workspace = true
proptest.workspace = true
# Dev/bench-only reference implementations (S07 MESH-03, THIRD_PARTY.md).
obvhs = { version = "=0.4.0", features = ["parallel"] }
parry3d-f64 = "=0.31.1"

[[bench]]
name = "mesh_build"
harness = false

[[bench]]
name = "smooth"
harness = false

[[bench]]
name = "iso"
harness = false

[[bench]]
name = "mesh_spatial"
harness = false

[[bench]]
name = "mesh_decimate"
harness = false

[[bench]]
name = "mesh_selfint"
harness = false

[[bench]]
name = "mesh_analysis"
harness = false

[[bench]]
name = "mesh_remesh"
harness = false

[lints]
workspace = true
