version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amg-core.workspace = true
amg-jobs.workspace = true
amg-mesh.workspace = true
amg-implicit.workspace = true
amg-io.workspace = true
rayon.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
amg-mesh = { workspace = true, features = ["corpus"] }
amg-testkit.workspace = true
criterion.workspace = true
proptest.workspace = true
# Already used by amg-io tests (THIRD_PARTY.md): hand-off directories in AM-06 tests.
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[lints]
workspace = true

[[bench]]
