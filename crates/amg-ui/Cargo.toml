[package]
name = "amg-ui"
description = "egui app shell, command system, tools, dialogs, browser tree and timeline UI. Lane D owns the framework; domain lanes own their modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amg-core.workspace = true
amg-jobs.workspace = true
amg-doc.workspace = true
amg-features.workspace = true
amg-render.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_dock.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
directories.workspace = true
egui_kittest = { workspace = true, optional = true }

[features]
# `amg_ui::testing`: AppHarness (egui_kittest), NullViewport, CpuPickService stub. Dev/test only.
testing = ["dep:egui_kittest"]

[dev-dependencies]
amg-ui = { path = ".", features = ["testing"] }
amg-testkit.workspace = true
criterion.workspace = true

[[bench]]
name = "search"
harness = false

[[bench]]
name = "scene"
harness = false

[lints]
workspace = true
