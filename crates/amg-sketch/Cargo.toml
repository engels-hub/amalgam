[package]
name = "amg-sketch"
description = "2D sketch entities, constraint solver and profile/region detection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amg-core.workspace = true
amg-jobs.workspace = true
serde.workspace = true
# Corpus JSON (SK-14). `float_roundtrip`: exact f64 parsing, so sketches and corpus cases
# round-trip bit-identically.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# Not in [workspace.dependencies] yet (SK-01 may only touch this crate); hoist when a second
# crate (amg-mesh, S07) starts using it.
smallvec = { version = "1.16.3", features = ["serde"] }
# SK-03 sparse blocks (> 64 unknowns): sparse Cholesky of `J W⁻¹ Jᵀ + λI` with a cached
# symbolic factorisation. MIT; same pinned version as amg-mesh (ADR-006).
faer = { version = "=0.23.2", default-features = false, features = ["std", "sparse-linalg"] }
thiserror.workspace = true
# SK-10 glyph outlines (Google Fonts "fontations"). MIT OR Apache-2.0; pure safe Rust.
skrifa = { version = "=0.49.0", default-features = false, features = ["std"] }
# SK-11 import. `dxf` MIT, `usvg` MPL-free since 0.38 (Apache-2.0 OR MIT); no text/raster
# features (paths only), so no font or image stack is pulled in.
dxf = "0.6.2"
usvg = { version = "0.48.1", default-features = false }
# SK-13 / ADR-007 comparison backends (corpus::compare). Optional and never default.
# GPL-3.0 (ADR-012): libslvs is a dev/test oracle only; see THIRD_PARTY.md.
slvs = { version = "0.6.0", optional = true }
# MIT, dev-only comparison.
kcl-ezpz = { version = "0.2.18", optional = true }

[features]
# libslvs differential oracle / SK-13 option B. Needs a C++ compiler and libclang <= 15
# (LIBCLANG_PATH) for the slvs crate's bindgen 0.64.
slvs = ["dep:slvs"]
# ezpz comparison (SK-13 option C).
ezpz-bench = ["dep:kcl-ezpz"]

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "profiles"
harness = false

[[bench]]
name = "solver_compare"
harness = false

[[bench]]
name = "solver"
harness = false

[[bench]]
name = "dof"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "drag"
harness = false

[lints]
workspace = true
