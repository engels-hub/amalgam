[package]
name = "amg-sketch"
description = "2D sketch entities, constraint solver and profile/region detection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amg-core.workspace = true
amg-jobs.workspace = true
serde.workspace = true
# Not in [workspace.dependencies] yet (SK-01 may only touch this crate); hoist when a second
# crate (amg-mesh, S07) starts using it.
smallvec = { version = "1.16.3", features = ["serde"] }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
# `float_roundtrip`: exact f64 parsing, so sketches round-trip bit-identically.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[bench]]
name = "profiles"
harness = false

[lints]
workspace = true
