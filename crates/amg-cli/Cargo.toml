[package]
name = "amg-cli"
description = "Headless Amalgam command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "amg-cli"
path = "src/main.rs"

[dependencies]
amg-brep.workspace = true
amg-core.workspace = true
amg-jobs.workspace = true
clap.workspace = true
tracing.workspace = true

[features]
# Tracy profiler layer (forwards to amg-jobs).
tracy = ["amg-jobs/tracy"]
# Link OCCT for `kernel harness` (S20 KH-02); without it every corpus case is a setup error.
occt = ["amg-brep/occt"]

[lints]
workspace = true
