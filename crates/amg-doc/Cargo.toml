[package]
name = "amg-doc"
description = "Document model: design tree, timeline, parameters, persistent naming, undo/redo and the .amg format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
amg-core.workspace = true
amg-jobs.workspace = true
amg-nurbs.workspace = true
amg-brep.workspace = true
amg-sketch.workspace = true
amg-mesh.workspace = true
amg-implicit.workspace = true
amg-subd.workspace = true
amg-materials.workspace = true
amg-io.workspace = true
amg-fem.workspace = true
amg-topopt.workspace = true
amg-am.workspace = true
imbl.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[features]
# Registers the test-only features (`test.counter`, `test.box`, `test.add_mesh`) in
# `amg_doc::testing`. Never enabled by binaries; this crate's integration tests and benches get
# it through the self dev-dependency below.
test-features = []

[dev-dependencies]
amg-doc = { path = ".", features = ["test-features"] }
criterion.workspace = true
rpds.workspace = true

[[bench]]
name = "snapshot"
harness = false

[lints]
workspace = true
